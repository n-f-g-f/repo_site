 $("mg-wrap").style.display=view==="p"?"":"none";
 var rows=view==="p"?D.players.filter(function(p){return p.g>=mg&&(!team||p.t===team);}):D.teams.filter(function(t){return !team||t.t===team;});
 var gv=view==="p"?pval:tval;
 rows.sort(function(a,b){var x=gv(a,key),y=gv(b,key);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;var c=(typeof x==="number"&&typeof y==="number")?x-y:String(x).localeCompare(String(y));return sortD==="asc"?c:-c;});
 $("th").innerHTML="<tr>"+(view==="p"?"<th>#</th>":"<th>#</th>")+cols.map(function(c){return '<th data-k="'+c[0]+'" class="'+(c[0]===key?sortD:"")+'">'+c[1]+"</th>";}).join("")+"</tr>";
 $("meta").textContent=rows.length+(view==="p"?" players":" teams");
 if(!rows.length){$("tb").innerHTML='<tr><td class="empty" colspan="'+(cols.length+1)+'">No clutch data with these filters.</td></tr>';return;}
 $("tb").innerHTML=rows.map(function(r,i){
  if(view==="p"){var nm=r.hub?'<a hr'+'ef="'+esc(r.hub)+'">'+esc(r.n)+"</a>":esc(r.n);
   return "<tr><td>"+(i+1)+"</td><td>"+nm+"</td><td>"+esc(teams[r.t]||r.t)+"</td><td>"+r.g+"</td><td>"+r.pts+"</td><td>"+f1(r.g?r.pts/r.g:null)+"</td><td>"+r.fgm+"-"+r.fga+"</td><td>"+pc(r.fg)+"</td><td>"+r.tpm+"-"+r.tpa+"</td><td>"+r.ftm+"-"+r.fta+"</td><td>"+pc(r.ts)+"</td><td>"+r.reb+"</td><td>"+r.ast+"</td><td>"+r.tov+"</td><td>"+r.stl+"</td><td>"+r.blk+"</td></tr>";}
  var tm='<a hr'+'ef="../scouting/team_hub.html?team='+encodeURIComponent(r.t)+'">'+esc(r.n)+"</a>";
  return "<tr><td>"+(i+1)+"</td><td>"+tm+"</td><td>"+r.w+"-"+r.l+"</td><td>"+r.g+"</td><td>"+f1(r.pf)+"</td><td>"+f1(r.pa)+"</td><td>"+f1(r.ortg)+"</td><td>"+f1(r.drtg)+"</td><td class='"+(r.net==null?"":(r.net>0?"pos":"neg"))+"'>"+sg(r.net)+"</td><td>"+pc(r.efg)+"</td><td>"+r.tov+"</td><td>"+r.fta+"</td></tr>";
 }).join("");
 $("note").textContent=view==="p"
  ?"G = games in which the player recorded at least one action in clutch time. Ranked by total clutch points by default; click any header to sort. Minimum games starts at "+D.min_games+" and can be changed."
  :"Clutch record = final result of games that had clutch time. PF/PA = points scored/allowed in clutch time; ratings per 100 estimated possessions (FGA − ORB + TOV + 0.44 × FTA).";
}
document.querySelector("thead").addEventListener("click",function(ev){var th=ev.target.closest("th");if(!th||!th.dataset.k)return;var k=th.dataset.k;
 if(sortK===k)sortD=sortD==="desc"?"asc":"desc";else{sortK=k;sortD=(k==="n"||k==="t"||k==="drtg")?"asc":"desc";}render();});
Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.addEventListener("click",function(){
 document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});b.classList.add("on");view=b.dataset.v;sortK=null;sortD="desc";render();});});
$("team").addEventListener("change",render);$("mg").addEventListener("input",render);
render();
})();
</script></body></html>
