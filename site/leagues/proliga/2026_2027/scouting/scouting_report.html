ng:0 16px 10px;}}</style><script src="/pba-glossary.js" defer></script></head><body><header class="pba-context-header" data-pba-context-chrome="1"><div class="pba-context-inner"><div class="pba-context-brand"><a class="pba-context-brand-mark" href="../../../../index.html">PBA</a><div class="pba-context-brand-copy"><div class="pba-context-brand-name">Proliga </div><div class="pba-context-brand-sub">2026-2027 · Context overview</div></div></div><div class="pba-search" role="search"><input id="pba-search-input" type="search" placeholder="Search player or team…" autocomplete="off" aria-label="Search player or team"><div id="pba-search-results" class="pba-search-results"></div></div><script>
(function () {
  var LEAGUES = [{"key": "betclic", "name": "Betclic"}, {"key": "betclic_fem", "name": "Betclic_Fem"}, {"key": "proliga", "name": "Proliga"}];
  var box = document.getElementById("pba-search-input");
  var out = document.getElementById("pba-search-results");
  if (!box || !out) return;
  var DATA = null, loading = null, timer = null, signedIn = true;
  function norm(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function load() {
    if (loading) return loading;
    loading = fetch("/api/session", { credentials: "include" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (s) {
        var acc = s && s.authenticated ? s.access : null;
        signedIn = !!(s && s.authenticated);
        var keys = LEAGUES.map(function (l) { return l.key; });
        if (!(acc && acc.can_access_all)) {
          var allowed = acc && Array.isArray(acc.allowed_leagues) ? acc.allowed_leagues.map(function (x) { return String(x).toLowerCase(); }) : [];
          keys = keys.filter(function (k) { return allowed.indexOf(k) >= 0; });
        }
        return Promise.all(keys.map(function (k) {
          return fetch("/leagues/" + k + "/search_index.json", { credentials: "include" })
            .then(function (r) { return r.ok ? r.json() : []; })
            .catch(function () { return []; });
        }));
      })
      .then(function (lists) {
        DATA = [];
        lists.forEach(function (l) { if (Array.isArray(l)) DATA = DATA.concat(l); });
        DATA.forEach(function (e) {
          e._name = norm(e.name);
          e._all = norm([e.name, e.team, e.team_key, e.league_name].join(" "));
        });
        return DATA;
      });
    return loading;
  }
  function score(e, q) {
    var s = 0;
    if (e._name.indexOf(q) === 0) s -= 100;
    else if (e._name.indexOf(" " + q) >= 0 || e._name.indexOf("." + q) >= 0) s -= 60;
    if (e.current) s -= 20;
    if (e.type === "team") s -= 5;
    return s;
  }
  function render() {
    var q = norm(box.value);
    if (q.length < 2) { out.style.display = "none"; out.innerHTML = ""; return; }
    load().then(function () {
      var tokens = q.split(/\s+/);
      var hits = DATA.filter(function (e) { return tokens.every(function (t) { return e._all.indexOf(t) >= 0; }); });
      hits.sort(function (a, b) {
        return (score(a, q) - score(b, q)) || String(b.season || "").localeCompare(String(a.season || "")) || String(a.name).localeCompare(String(b.name));
      });
      hits = hits.slice(0, 12);
      if (!hits.length) {
        out.innerHTML = '<div class="pba-search-empty">' + (signedIn ? "No players or teams found in the leagues of your plan." : "Sign in to search players and teams.") + "</div>";
      } else {
        out.innerHTML = hits.map(function (e, i) {
          var meta = e.type === "team"
            ? esc(e.league_name) + " · " + esc(e.season_label)
            : esc(e.team || e.team_key) + " · " + esc(e.league_name) + " " + esc(e.season_label);
          return '<a class="pba-search-item' + (i === 0 ? " pba-search-item-first" : "") + '" hr' + 'ef="' + esc(e.href) + '">' +
            '<span class="pba-search-type pba-search-type-' + esc(e.type) + '">' + (e.type === "team" ? "Team" : "Player") + "</span>" +
            '<span class="pba-search-text"><span class="pba-search-name">' + esc(e.name) + "</span>" +
            '<span class="pba-search-meta">' + meta + (e.current ? ' · <b>current</b>' : "") + "</span></span></a>";
        }).join("");
      }
      out.style.display = "block";
    });
  }
  box.addEventListener("focus", function () { load(); if (box.value) render(); });
  box.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(render, 120); });
  box.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { out.style.display = "none"; box.blur(); }
    if (ev.key === "Enter") { var first = out.querySelector("a.pba-search-item"); if (first) window.location.href = first.getAttribute("href"); }
  });
  document.addEventListener("click", function (ev) { if (!ev.target.closest(".pba-search")) out.style.display = "none"; });
})();
</script><div class="pba-myteam" id="pba-myteam" style="display:none"></div><script>
(function () {
  var box = document.getElementById("pba-myteam");
  if (!box) return;
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  var parts = window.location.pathname.split("/").filter(Boolean);
  var pageLeague = parts[0] === "leagues" ? String(parts[1] || "").toLowerCase() : "";
  var pageTeam = (new URLSearchParams(window.location.search).get("team") || "").toUpperCase();
  if (!/^[A-Z0-9]{2,6}$/.test(pageTeam) || parts.indexOf("scouting") < 0) pageTeam = "";
  function save(body) {
    return fetch("/api/preferences", { method: "POST", credentials: "include", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  Promise.all([
    fetch("/api/session", { credentials: "include" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    fetch("/current_seasons.json", { credentials: "include" }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
  ]).then(function (res) {
    var s = res[0], seasons = res[1] || {};
    if (!s || !s.authenticated) return;
    var u = s.user || {}, fl = String(u.favorite_league_key || "").toLowerCase(), ft = String(u.favorite_team_key || "").toUpperCase();
    var html = "";
    if (fl && ft && seasons[fl]) {
      var base = "/leagues/" + fl + "/" + seasons[fl] + "/scouting/";
      html += '<a class="pba-myteam-link" hr' + 'ef="' + esc(base + "team_hub.html?team=" + ft) + '" title="Open my team">\u2605 My team: ' + esc(ft) + '</a>' +
              '<a class="pba-myteam-sub" hr' + 'ef="' + esc(base + "next_opponent.html?team=" + ft) + '">Next opponent</a>';
    }
    if (pageTeam && pageLeague) {
      if (pageTeam === ft && pageLeague === fl) html += '<button type="button" class="pba-myteam-btn" data-act="clear" title="Remove as my team">Remove</button>';
      else html += '<button type="button" class="pba-myteam-btn" data-act="set">\u2606 Set ' + esc(pageTeam) + ' as my team</button>';
    }
    box.innerHTML = html;
    box.style.display = html ? "" : "none";
    var btn = box.querySelector(".pba-myteam-btn");
    if (btn) btn.addEventListener("click", function () {
      btn.disabled = true;
      var body = btn.getAttribute("data-act") === "clear" ? { clear: true } : { league_key: pageLeague, team_key: pageTeam };
      save(body).then(function (ok) { if (ok) window.location.reload(); else { btn.disabled = false; btn.textContent = "Could not save"; } });
    });
  });
})();

  '<div class="kpi"><span class="muted small">OffRtg</span><b>'+f1(t.m.off_rating)+'</b><span class="small">'+rankTxt(t.r.off_rating)+'</span></div><div class="kpi"><span class="muted small">DefRtg</span><b>'+f1(t.m.def_rating)+'</b><span class="small">'+rankTxt(t.r.def_rating)+'</span></div>'+
  '<div class="kpi"><span class="muted small">Pace</span><b>'+f1(t.m.pace)+'</b><span class="small">'+rankTxt(t.r.pace)+'</span></div></div>'+
  '<h2>Key points</h2><ul class="keys">'+kp.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'+
  '<h2>Matchup edges vs '+esc(me.name)+'</h2>'+edges()+
  '<h2>Team profile</h2>'+profile()+
  '<div class="two"><div><h2>Quarter profile</h2>'+quarters()+'</div><div><h2>Head-to-head this season</h2>'+h2h()+'</div></div>'+foot()+
  '<div class="page-break"></div><h2>How they play · most-used lineups</h2>'+lineups()+'<h2>Shot diet</h2>'+zones()+foot()+
  '<div class="page-break"></div><h2>Rotation players</h2>'+(t.players.length?t.players.map(playerCard).join(""):'<div class="empty">No player data.</div>')+foot();
 R.innerHTML=html;}
render();
})();
</script></body></html>
