(function () {
  var LEAGUES = [{"key": "betclic", "name": "Betclic"}, {"key": "betclic_fem", "name": "Betclic_Fem"}, {"key": "proliga", "name": "Proliga"}];
  var box = document.getElementById("pba-search-input");
  var out = document.getElementById("pba-search-results");
  if (!box || !out) return;
  var DATA = null, loading = null, timer = null, signedIn = true;
  function norm(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function load() {
    if (loading) return loading;
    loading = fetch("/api/session", { credentials: "include" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (s) {
        var acc = s && s.authenticated ? s.access : null;
        signedIn = !!(s && s.authenticated);
        var keys = LEAGUES.map(function (l) { return l.key; });
        if (!(acc && acc.can_access_all)) {
          var allowed = acc && Array.isArray(acc.allowed_leagues) ? acc.allowed_leagues.map(function (x) { return String(x).toLowerCase(); }) : [];
          keys = keys.filter(function (k) { return allowed.indexOf(k) >= 0; });
        }
        return Promise.all(keys.map(function (k) {
          return fetch("/leagues/" + k + "/search_index.json", { credentials: "include" })
            .then(function (r) { return r.ok ? r.json() : []; })
            .catch(function () { return []; });
        }));
      })
      .then(function (lists) {
        DATA = [];
        lists.forEach(function (l) { if (Array.isArray(l)) DATA = DATA.concat(l); });
        DATA.forEach(function (e) {
          e._name = norm(e.name);
          e._all = norm([e.name, e.team, e.team_key, e.league_name].join(" "));
        });
        return DATA;
      });
    return loading;
  }
  function score(e, q) {
    var s = 0;
    if (e._name.indexOf(q) === 0) s -= 100;
    else if (e._name.indexOf(" " + q) >= 0 || e._name.indexOf("." + q) >= 0) s -= 60;
    if (e.current) s -= 20;
    if (e.type === "team") s -= 5;
    return s;
  }
  function render() {
    var q = norm(box.value);
    if (q.length < 2) { out.style.display = "none"; out.innerHTML = ""; return; }
    load().then(function () {
      var tokens = q.split(/\s+/);
      var hits = DATA.filter(function (e) { return tokens.every(function (t) { return e._all.indexOf(t) >= 0; }); });
      hits.sort(function (a, b) {
        return (score(a, q) - score(b, q)) || String(b.season || "").localeCompare(String(a.season || "")) || String(a.name).localeCompare(String(b.name));
      });
      hits = hits.slice(0, 12);
      if (!hits.length) {
        out.innerHTML = '<div class="pba-search-empty">' + (signedIn ? "No players or teams found in the leagues of your plan." : "Sign in to search players and teams.") + "</div>";
      } else {

            '<span class="pba-search-text"><span class="pba-search-name">' + esc(e.name) + "</span>" +
            '<span class="pba-search-meta">' + meta + (e.current ? ' · <b>current</b>' : "") + "</span></span></a>";
        }).join("");
      }
      out.style.display = "block";
    });
  }
  box.addEventListener("focus", function () { load(); if (box.value) render(); });
  box.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(render, 120); });
  box.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { out.style.display = "none"; box.blur(); }

  });
  document.addEventListener("click", function (ev) { if (!ev.target.closest(".pba-search")) out.style.display = "none"; });
})();
</script><div class="pba-myteam" id="pba-myteam" style="display:none"></div><script>
(function () {

  var parts = window.location.pathname.split("/").filter(Boolean);
  var pageLeague = parts[0] === "leagues" ? String(parts[1] || "").toLowerCase() : "";
  var pageTeam = (new URLSearchParams(window.location.search).get("team") || "").toUpperCase();
  if (!/^[A-Z0-9]{2,6}$/.test(pageTeam) || parts.indexOf("scouting") < 0) pageTeam = "";
  function save(body) {
    return fetch("/api/preferences", { method: "POST", credentials: "include", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  Promise.all([
    fetch("/api/preferences", { credentials: "include" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    fetch("/current_seasons.json", { credentials: "include" }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
  ]).then(function (res) {
    var p = res[0], seasons = res[1] || {};
    if (!p || !p.ok) return;
    var fav = p.favorite || {}, fl = String(fav.league_key || "").toLowerCase(), ft = String(fav.team_key || "").toUpperCase();
    var html = "";
    if (fl && ft && seasons[fl]) {
      var base = "/leagues/" + fl + "/" + seasons[fl] + "/scouting/";
      html += '<a class="pba-myteam-link" hr' + 'ef="' + esc(base + "team_hub.html?team=" + ft) + '" title="Open my team">\u2605 My team: ' + esc(ft) + '</a>' +
              '<a class="pba-myteam-sub" hr' + 'ef="' + esc(base + "next_opponent.html?team=" + ft) + '">Next opponent</a>';
    }
    var fol = Array.isArray(p.followed) ? p.followed : [];
    if (fol.length) {
      html += '<details class="pba-follow-menu"><summary>\u2605 Followed (' + fol.length + ')</summary><div class="pba-follow-list">' +
        fol.map(function (f) {
          var label = esc(f.player_name || f.player_key) + ' <span>' + esc(f.team_key) + '</span>';
          return f.hub_path ? '<a hr' + 'ef="' + esc(f.hub_path) + '">' + label + '</a>' : '<div>' + label + '</div>';
        }).join("") + '<a class="pba-follow-manage" hr' + 'ef="/account.html">Manage in My account \u2192</a></div></details>';
    }
    html += '<a class="pba-myteam-sub" hr' + 'ef="/account.html">My account</a>';
    if (pageTeam && pageLeague) {
      if (pageTeam === ft && pageLeague === fl) html += '<button type="button" class="pba-myteam-btn" data-act="clear" title="Remove as my team">Remove</button>';
      else html += '<button type="button" class="pba-myteam-btn" data-act="set">\u2606 Set ' + esc(pageTeam) + ' as my team</button>';
    }
    box.innerHTML = html;
    box.style.display = html ? "" : "none";
    var btn = box.querySelector(".pba-myteam-btn");
    if (btn) btn.addEventListener("click", function () {
      btn.disabled = true;
      var body = btn.getAttribute("data-act") === "clear" ? { clear: true } : { league_key: pageLeague, team_key: pageTeam };
      save(body).then(function (ok) { if (ok) window.location.reload(); else { btn.disabled = false; btn.textContent = "Could not save"; } });
    });
  });
})();

function zonesFull(){var t=D.teams[op];var a=zoneSide(t,"off"),d=zoneSide(t,"def");if(!a&&!d)return zones();
 return '<h3 style="margin:6px 0 4px">Where they shoot (offense)</h3>'+(a||'<div class="empty">No data.</div>')+
  '<h3 style="margin:10px 0 4px">What they allow (defense)</h3>'+(d||'<div class="empty">No data.</div>')+
  '<div class="muted small" style="margin-top:4px">Ranks within the league. Offense: #1 = most attempts / best efficiency. Defense: #1 = fewest attempts / lowest efficiency allowed. Green = better than league average, red = worse. n/r = sample too small to rank.</div>';}
function zoneKeyPoints(t){var out=[];if(!t.zl||!(D.zones||[]).length)return out;var n=D.zn||D.nteams;
 ZGRP.forEach(function(z){var d=t.zl.def[z],o=t.zl.off[z];
  if(d&&d[5]!=null&&d[5]>n-3)out.push({s:0.85,txt:"Weak defending "+z+": allows "+pc(d[2])+" FG% (#"+d[5]+"/"+n+") — attack it."});
  if(d&&d[5]!=null&&d[5]<=2)out.push({s:0.6,txt:"Strong defending "+z+": allows only "+pc(d[2])+" FG% (#"+d[5]+"/"+n+")."});
  if(o&&o[4]!=null&&o[4]<=2)out.push({s:0.7,txt:"Lives in "+z+": "+f1(o[0])+" attempts per game (#"+o[4]+"/"+n+"), "+pc(o[2])+" FG%."});});
 return out;}
var OBJ=D.women?"her":"him";
var PL={ppg:"PPG",ts_pct:"TS%",usg_pct:"USG%",ast_pct:"AST%",tov_pct:"TOV%",tp_pct:"3P%",trb_pct:"TRB%",stl_pct:"STL%",blk_pct:"BLK%",on_off_net_diff_per40:"On-Off"};
function role(p){var u=p.usg_pct||0,a=p.ast_pct||0,r=p.trb_pct||0,t3=p.tpa_pg||0;
 if(a>=0.25&&u>=0.20)return "Primary creator";if(u>=0.26)return "Volume scorer";if(t3>=3&&(p.tp_pct||0)>=0.33)return "Shooter";
 if(r>=0.14||p.pos==="C")return "Interior / rebounder";if((p.ts_pct||0)>=0.58&&u<0.2)return "Efficient finisher";return "Role player";}
function notes(p){var n=[];
 if(p.tp_pct!=null&&p.tpa_pg!=null){if(p.tp_pct>=0.37&&p.tpa_pg>=2)n.push("Dangerous from three: "+pc(p.tp_pct)+" on "+f1(p.tpa_pg)+" attempts per game — close out hard.");else if(p.tp_pct<0.28&&p.tpa_pg>=1.5)n.push("Low 3P% ("+pc(p.tp_pct)+" on "+f1(p.tpa_pg)+" 3PA/G) — can go under screens.");else if(p.tpa_pg<0.6)n.push("Rarely shoots threes ("+f1(p.tpa_pg)+" 3PA/G) — can sag off.");}
 if(p.usg_pct!=null&&p.usg_pct>=0.26)n.push("High usage ("+pc(p.usg_pct)+"): offense runs through "+OBJ+".");
 if(p.tov_pct!=null&&p.tov_pct>=0.18)n.push("Turnover prone (TOV% "+pc(p.tov_pct)+") — pressure the ball.");
 if(p.ast_pct!=null&&p.ast_pct>=0.25)n.push("Main playmaker (AST% "+pc(p.ast_pct)+") — limit passing lanes.");
 if(p.orb_pct!=null&&p.orb_pct>=0.09)n.push("Crashes the offensive glass (ORB% "+pc(p.orb_pct)+") — box out.");
 if(p.ft_pct!=null&&p.ft_pct<0.6&&(p.mpg||0)>=15)n.push("Poor free-throw shooter ("+pc(p.ft_pct)+").");
 if(p.ts_pct!=null&&p.ts_pct>=0.6&&(p.ppg||0)>=8)n.push("Very efficient scorer (TS "+pc(p.ts_pct)+").");
 if(p.on_off_net_diff_per40!=null&&p.on_off_net_diff_per40>=8&&(p.mpg||0)>=12)n.push("Team is much better with "+OBJ+" on court ("+sgn(p.on_off_net_diff_per40)+" per 40).");
 if(p.blk_pct!=null&&p.blk_pct>=0.04)n.push("Rim protector (BLK% "+pc(p.blk_pct)+").");
 if(p.stl_pct!=null&&p.stl_pct>=0.025)n.push("Active hands (STL% "+pc(p.stl_pct)+").");
 return n.slice(0,4);}
function badge(k,v){if(v==null)return "";var c=k==="usg_pct"?"pm":(v>=75?"pg":(v<=25?"pr":"pm"));return '<span class="pb '+c+'">'+PL[k]+' P'+v+'</span>';}
function playerCard(p){var bio=[p.pos||"",p.age!=null?p.age+" y/o":"",p.ht?(p.ht/100).toFixed(2)+" m":"",p.nat||""].filter(Boolean).join(" · ");
 var st=[["G",p.games==null?"—":p.games],["MPG",f1(p.mpg)],["PPG",f1(p.ppg)],["RPG",f1(p.rpg)],["APG",f1(p.apg)],["TS%",pc(p.ts_pct)],["3P%",pc(p.tp_pct)],["3PA/G",f1(p.tpa_pg)],["On-Off",sgn(p.on_off_net_diff_per40)]];
 var pct=p.pct?Object.keys(PL).map(function(k){return badge(k,p.pct[k]);}).join(""):"";
 var nt=notes(p);
 return '<div class="pcard"><div class="ph"><h3>'+esc(p.n)+'<span class="tag">'+esc(role(p))+'</span></h3><span class="muted small">'+esc(bio)+'</span></div>'+
  '<div class="stats">'+st.map(function(s){return '<div class="st"><span class="muted small">'+s[0]+'</span><b>'+s[1]+'</b></div>';}).join("")+'</div>'+
  (pct?'<div>'+pct+'</div>':'<div class="muted small">No league percentiles (below minutes/games threshold).</div>')+
  (nt.length?'<ul class="notes">'+nt.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>':'')+'</div>';}
function foot(){return '<div class="foot"><span>PBA · '+esc(D.league||"")+' '+esc(D.season||"")+'</span><span>'+esc(D.fresh||"")+'</span><span>Generated '+new Date().toISOString().slice(0,10)+'</span></div>';}
function render(){var R=$("report");if(!my||!op||!D.teams[op]){R.innerHTML='<div class="empty">No team data available.</div>';return;}
 var u=new URL(window.location.href);u.searchParams.set("team",my);u.searchParams.set("opp",op);window.history.replaceState({},"",u.toString());
 var t=D.teams[op],me=D.teams[my],n=D.next[my];var game=(n&&n.o===op)?n:null;
 document.title="Scouting_"+op+(game&&game.r?"_R"+game.r:"");
 var kp=keyPoints(t,me);
 var html='<div class="cover">'+(t.logo?'<img src="'+esc(t.logo)+'" alt="">':'')+'<div><div class="muted small">OPPONENT SCOUTING REPORT · '+esc(D.league||"")+' '+esc(D.season||"")+'</div><h1>'+esc(t.name)+'</h1>'+
  '<div class="muted">'+(game?('Next game: '+esc(game.d)+' · Round '+esc(game.r)+' · '+(game.ha==="Home"?"home vs ":"away @ ")+esc(t.name)):('Prepared for '+esc(me.name)))+'</div></div></div>'+
  '<div class="kpis"><div class="kpi"><span class="muted small">Record</span><b>'+t.w+'-'+(t.g-t.w)+'</b></div><div class="kpi"><span class="muted small">NetRtg</span><b>'+sgn(t.m.net_rating)+'</b><span class="small">'+rankTxt(t.r.net_rating)+'</span></div>'+
  '<div class="kpi"><span class="muted small">OffRtg</span><b>'+f1(t.m.off_rating)+'</b><span class="small">'+rankTxt(t.r.off_rating)+'</span></div><div class="kpi"><span class="muted small">DefRtg</span><b>'+f1(t.m.def_rating)+'</b><span class="small">'+rankTxt(t.r.def_rating)+'</span></div>'+
  '<div class="kpi"><span class="muted small">Pace</span><b>'+f1(t.m.pace)+'</b><span class="small">'+rankTxt(t.r.pace)+'</span></div></div>'+
  '<h2>Key points</h2><ul class="keys">'+kp.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'+
  '<h2>Matchup edges vs '+esc(me.name)+'</h2>'+edges()+
  '<h2>Team profile</h2>'+profile()+
  '<div class="two"><div><h2>Quarter profile</h2>'+quarters()+'</div><div><h2>Head-to-head this season</h2>'+h2h()+'</div></div>'+foot()+
  '<div class="page-break"></div><h2>How they play · most-used lineups</h2>'+lineups()+'<h2>Shot zones vs league</h2>'+zonesFull()+foot()+
  '<div class="page-break"></div><h2>Rotation players</h2>'+(t.players.length?t.players.map(playerCard).join(""):'<div class="empty">No player data.</div>')+foot();
 R.innerHTML=html;}
render();
})();
</script></body></html>
