 if(t.r.pace!=null){if(t.r.pace<=3)pts.push({s:1,txt:"Plays fast: top-"+t.r.pace+" pace ("+f1(t.m.pace)+")."});else if(t.r.pace>n-3)pts.push({s:1,txt:"Slows the game down: one of the slowest paces ("+f1(t.m.pace)+")."});}
 var q=["Q1","Q2","Q3","Q4"].filter(function(k){return t.q[k]!=null;});
 if(q.length){q.sort(function(a,b){return t.q[b]-t.q[a];});pts.push({s:0.5,txt:"Strongest quarter "+q[0]+" ("+sgn(t.q[q[0]])+"), weakest "+q[q.length-1]+" ("+sgn(t.q[q[q.length-1]])+")."});}
 pts.push({s:0.4,txt:"Form: "+t.l5.w+"-"+t.l5.l+" in the last 5 (NetRtg "+sgn(t.l5.net)+")."});
 var P=t.players.slice();if(P.length){var top=P.slice().sort(function(a,b){return (b.ppg||0)-(a.ppg||0);})[0];pts.push({s:0.9,txt:"Main scorer: "+top.n+" ("+f1(top.ppg)+" PPG, TS "+pc(top.ts_pct)+")."});
  var imp=P.filter(function(p){return p.on_off_net_diff_per40!=null&&(p.mpg||0)>=12;}).sort(function(a,b){return b.on_off_net_diff_per40-a.on_off_net_diff_per40;})[0];
  if(imp&&imp.on_off_net_diff_per40>=5)pts.push({s:0.8,txt:"Biggest impact on court: "+imp.n+" (On-Off "+sgn(imp.on_off_net_diff_per40)+" per 40)."});}
 pts.sort(function(a,b){return b.s-a.s;});return pts.slice(0,6).map(function(p){return p.txt;});}
function edgeTxt(offT,defT,offK,defK,higherGood){var o=D.teams[offT].m[offK],d=D.teams[defT].m[defK],lo=D.lg[offK],ld=D.lg[defK];
 if(o==null||d==null||lo==null||ld==null)return {c:"",t:"—"};var v=(o-lo)+(d-ld);if(!higherGood)v=-v;
 if(v>0.012)return {c:"good",t:"Edge "+esc(D.teams[my].name)};if(v<-0.012)return {c:"bad",t:"Edge "+esc(D.teams[op].name)};return {c:"",t:"Even"};}
function edges(){var pairs=[["Our shooting",my,op,"efg_pct_off","efg_pct_def",true],["Our ball security",my,op,"tov_pct_off","tov_pct_def",false],["Our off. glass",my,op,"orb_pct_off","orb_pct_def",true],["Our free throws",my,op,"ftr_off","ftr_def",true],
 ["Their shooting",op,my,"efg_pct_off","efg_pct_def",false],["Their ball security",op,my,"tov_pct_off","tov_pct_def",true],["Their off. glass",op,my,"orb_pct_off","orb_pct_def",false],["Their free throws",op,my,"ftr_off","ftr_def",false]];
 return '<div class="edges">'+pairs.map(function(p){var e=edgeTxt(p[1],p[2],p[3],p[4],p[5]);return '<div class="edge"><div class="t">'+p[0]+'</div><div class="'+e.c+'">'+e.t+'</div></div>';}).join("")+'</div>';}
function profile(){var A=D.teams[op],B=D.teams[my];var n=D.nteams;
 return '<table><thead><tr><th>Metric</th><th>'+esc(A.name)+'</th><th>Rank</th><th>'+esc(B.name)+'</th><th>Rank</th><th>League avg</th></tr></thead><tbody>'+D.metrics.map(function(m){
  function cls(r){return r==null||m.dir==="style"?"":(r<=3?"good":(r>n-3?"bad":""));}
  return '<tr><td>'+esc(m.l)+'</td><td class="'+cls(A.r[m.k])+'">'+fmt(m,A.m[m.k])+'</td><td>'+(A.r[m.k]||"—")+'</td><td>'+fmt(m,B.m[m.k])+'</td><td>'+(B.r[m.k]||"—")+'</td><td>'+fmt(m,D.lg[m.k])+'</td></tr>';}).join("")+'</tbody></table>';}
function quarters(){var A=D.teams[op],B=D.teams[my];return '<table><thead><tr><th>Quarter</th><th>'+esc(A.name)+'</th><th>'+esc(B.name)+'</th></tr></thead><tbody>'+["Q1","Q2","Q3","Q4"].map(function(q){
 function c(v){return '<td class="'+(v==null?"":(v>=0?"good":"bad"))+'">'+sgn(v)+'</td>';}return '<tr><td>'+q+'</td>'+c(A.q[q])+c(B.q[q])+'</tr>';}).join("")+'</tbody></table>';}
function h2h(){var rows=D.h2h.filter(function(g){return g.t===op&&g.o===my;});if(!rows.length)return '<div class="empty">No games between these teams yet this season.</div>';
 return '<table><thead><tr><th>Date</th><th>R</th><th>'+esc(D.teams[op].name)+'</th><th>Result</th><th>Score</th></tr></thead><tbody>'+rows.map(function(g){
 return '<tr><td>'+esc(g.d)+'</td><td>'+(g.r==null?"—":g.r)+'</td><td>'+esc(g.ha)+'</td><td class="'+(g.res==="W"?"bad":"good")+'">'+esc(g.res)+'</td><td>'+(g.pf==null?"—":Math.round(g.pf))+'-'+(g.pa==null?"—":Math.round(g.pa))+'</td></tr>';}).join("")+'</tbody></table>';}
function lineups(){var L=D.teams[op].lineups;if(!L.length)return '<div class="empty">No lineup data.</div>';
 return '<table><thead><tr><th>Lineup</th><th>Min</th><th>NetRtg</th><th>OffRtg</th><th>DefRtg</th></tr></thead><tbody>'+L.map(function(l){
 return '<tr><td style="white-space:normal">'+esc(l.p)+'</td><td>'+f1(l.min)+'</td><td class="'+(l.net==null?"":(l.net>=0?"good":"bad"))+'">'+sgn(l.net)+'</td><td>'+f1(l.off)+'</td><td>'+f1(l.def)+'</td></tr>';}).join("")+'</tbody></table>';}
function zones(){var Z=D.teams[op].zones;if(!Z.length)return '<div class="empty">No shot zone data.</div>';
 return '<table><thead><tr><th>Zone</th><th>Share</th><th>FG%</th></tr></thead><tbody>'+Z.map(function(z){return '<tr><td>'+esc(z.z)+'</td><td>'+pc(z.s)+'</td><td>'+pc(z.p)+'</td></tr>';}).join("")+'</tbody></table>';}
var PL={ppg:"PPG",ts_pct:"TS%",usg_pct:"USG%",ast_pct:"AST%",tov_pct:"TOV%",tp_pct:"3P%",trb_pct:"TRB%",stl_pct:"STL%",blk_pct:"BLK%",on_off_net_diff_per40:"On-Off"};
function role(p){var u=p.usg_pct||0,a=p.ast_pct||0,r=p.trb_pct||0,t3=p.tpa_pg||0;
 if(a>=0.25&&u>=0.20)return "Primary creator";if(u>=0.26)return "Volume scorer";if(t3>=3&&(p.tp_pct||0)>=0.33)return "Shooter";
 if(r>=0.14||p.pos==="C")return "Interior / rebounder";if((p.ts_pct||0)>=0.58&&u<0.2)return "Efficient finisher";return "Role player";}
function notes(p){var n=[];
 if(p.tp_pct!=null&&p.tpa_pg!=null){if(p.tp_pct>=0.37&&p.tpa_pg>=2)n.push("Dangerous from three: "+pc(p.tp_pct)+" on "+f1(p.tpa_pg)+" attempts per game — close out hard.");else if(p.tp_pct<0.28&&p.tpa_pg>=1.5)n.push("Low 3P% ("+pc(p.tp_pct)+" on "+f1(p.tpa_pg)+" 3PA/G) — can go under screens.");else if(p.tpa_pg<0.6)n.push("Rarely shoots threes ("+f1(p.tpa_pg)+" 3PA/G) — can sag off.");}
 if(p.usg_pct!=null&&p.usg_pct>=0.26)n.push("High usage ("+pc(p.usg_pct)+"): offense runs through him/her.");
 if(p.tov_pct!=null&&p.tov_pct>=0.18)n.push("Turnover prone (TOV% "+pc(p.tov_pct)+") — pressure the ball.");
 if(p.ast_pct!=null&&p.ast_pct>=0.25)n.push("Main playmaker (AST% "+pc(p.ast_pct)+") — limit passing lanes.");
 if(p.orb_pct!=null&&p.orb_pct>=0.09)n.push("Crashes the offensive glass (ORB% "+pc(p.orb_pct)+") — box out.");
 if(p.ft_pct!=null&&p.ft_pct<0.6&&(p.mpg||0)>=15)n.push("Poor free-throw shooter ("+pc(p.ft_pct)+").");
 if(p.ts_pct!=null&&p.ts_pct>=0.6&&(p.ppg||0)>=8)n.push("Very efficient scorer (TS "+pc(p.ts_pct)+").");
 if(p.on_off_net_diff_per40!=null&&p.on_off_net_diff_per40>=8&&(p.mpg||0)>=12)n.push("Team is much better with him/her on court ("+sgn(p.on_off_net_diff_per40)+" per 40).");
 if(p.blk_pct!=null&&p.blk_pct>=0.04)n.push("Rim protector (BLK% "+pc(p.blk_pct)+").");
 if(p.stl_pct!=null&&p.stl_pct>=0.025)n.push("Active hands (STL% "+pc(p.stl_pct)+").");
 return n.slice(0,4);}
function badge(k,v){if(v==null)return "";var c=k==="usg_pct"?"pm":(v>=75?"pg":(v<=25?"pr":"pm"));return '<span class="pb '+c+'">'+PL[k]+' P'+v+'</span>';}
function playerCard(p){var bio=[p.pos||"",p.age!=null?p.age+" y/o":"",p.ht?(p.ht/100).toFixed(2)+" m":"",p.nat||""].filter(Boolean).join(" · ");
 var st=[["G",p.games==null?"—":p.games],["MPG",f1(p.mpg)],["PPG",f1(p.ppg)],["RPG",f1(p.rpg)],["APG",f1(p.apg)],["TS%",pc(p.ts_pct)],["3P%",pc(p.tp_pct)],["3PA/G",f1(p.tpa_pg)],["On-Off",sgn(p.on_off_net_diff_per40)]];
 var pct=p.pct?Object.keys(PL).map(function(k){return badge(k,p.pct[k]);}).join(""):"";
 var nt=notes(p);
 return '<div class="pcard"><div class="ph"><h3>'+esc(p.n)+'<span class="tag">'+esc(role(p))+'</span></h3><span class="muted small">'+esc(bio)+'</span></div>'+
  '<div class="stats">'+st.map(function(s){return '<div class="st"><span class="muted small">'+s[0]+'</span><b>'+s[1]+'</b></div>';}).join("")+'</div>'+
  (pct?'<div>'+pct+'</div>':'<div class="muted small">No league percentiles (below minutes/games threshold).</div>')+
  (nt.length?'<ul class="notes">'+nt.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>':'')+'</div>';}
function foot(){return '<div class="foot"><span>PBA · '+esc(D.league||"")+' '+esc(D.season||"")+'</span><span>'+esc(D.fresh||"")+'</span><span>Generated '+new Date().toISOString().slice(0,10)+'</span></div>';}
function render(){var R=$("report");if(!my||!op||!D.teams[op]){R.innerHTML='<div class="empty">No team data available.</div>';return;}
 var u=new URL(window.location.href);u.searchParams.set("team",my);u.searchParams.set("opp",op);window.history.replaceState({},"",u.toString());
 var t=D.teams[op],me=D.teams[my],n=D.next[my];var game=(n&&n.o===op)?n:null;
 document.title="Scouting_"+op+(game&&game.r?"_R"+game.r:"");
 var kp=keyPoints(t,me);
 var html='<div class="cover">'+(t.logo?'<img src="'+esc(t.logo)+'" alt="">':'')+'<div><div class="muted small">OPPONENT SCOUTING REPORT · '+esc(D.league||"")+' '+esc(D.season||"")+'</div><h1>'+esc(t.name)+'</h1>'+
  '<div class="muted">'+(game?('Next game: '+esc(game.d)+' · Round '+esc(game.r)+' · '+(game.ha==="Home"?"home vs ":"away @ ")+esc(t.name)):('Prepared for '+esc(me.name)))+'</div></div></div>'+
  '<div class="kpis"><div class="kpi"><span class="muted small">Record</span><b>'+t.w+'-'+(t.g-t.w)+'</b></div><div class="kpi"><span class="muted small">NetRtg</span><b>'+sgn(t.m.net_rating)+'</b><span class="small">'+rankTxt(t.r.net_rating)+'</span></div>'+
  '<div class="kpi"><span class="muted small">OffRtg</span><b>'+f1(t.m.off_rating)+'</b><span class="small">'+rankTxt(t.r.off_rating)+'</span></div><div class="kpi"><span class="muted small">DefRtg</span><b>'+f1(t.m.def_rating)+'</b><span class="small">'+rankTxt(t.r.def_rating)+'</span></div>'+
  '<div class="kpi"><span class="muted small">Pace</span><b>'+f1(t.m.pace)+'</b><span class="small">'+rankTxt(t.r.pace)+'</span></div></div>'+
  '<h2>Key points</h2><ul class="keys">'+kp.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'+
  '<h2>Matchup edges vs '+esc(me.name)+'</h2>'+edges()+
  '<h2>Team profile</h2>'+profile()+
  '<div class="two"><div><h2>Quarter profile</h2>'+quarters()+'</div><div><h2>Head-to-head this season</h2>'+h2h()+'</div></div>'+foot()+
  '<div class="page-break"></div><h2>How they play · most-used lineups</h2>'+lineups()+'<h2>Shot diet</h2>'+zones()+foot()+
  '<div class="page-break"></div><h2>Rotation players</h2>'+(t.players.length?t.players.map(playerCard).join(""):'<div class="empty">No player data.</div>')+foot();
 R.innerHTML=html;}
render();
})();
